<!DOCTYPE html>
<html>
<head>
  <title>AVL Tree Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>AVL Tree Visualizer</h1>

<div class="input-box">
  <input id="values" placeholder="Enter numbers: 30 20 10">
  <button onclick="buildAVL()">Build Tree</button>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="panel">
    <h2>Meaning</h2>
    <div id="meaning"></div>
  </div>

  <!-- MIDDLE -->
  <div class="panel">
    <h2>Visualization</h2>
    <pre id="tree"></pre>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <h2>Steps</h2>
    <div id="steps"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
